<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Hello, I'm a Data Analyst. Welcome to my GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tx" gradientUnits="userSpaceOnUse" x1="75" y1="0" x2="825" y2="0">
      <stop offset="0" stop-color="#ff7eb3"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b9bf8"/>
    </linearGradient>
  </defs>
  <style>
    @font-face { font-family:'FR'; src:url(data:font/woff2;base64,) format('woff2'); font-weight:600; }
    @font-face { font-family:'PO'; src:url(data:font/woff2;base64,) format('woff2'); font-weight:600; }
    :root { --muted:#6e7781; }
    @media (prefers-color-scheme: dark) { :root { --muted:#9198a1; } }
    .lab { font-family:'PO','Segoe UI',Arial,sans-serif; font-weight:600; font-size:15px; letter-spacing:4px; fill:var(--muted); animation:in .6s ease both; }
    .l { font-family:'FR','Arial Rounded MT Bold','Segoe UI',Arial,sans-serif; font-weight:600; font-size:72px; fill:url(#tx);
          transform-box:fill-box; transform-origin:center bottom;
          animation:pop .5s cubic-bezier(.3,1.6,.5,1) both, bounce 2.6s ease-in-out 1s infinite; }
    .sp { transform-box:fill-box; transform-origin:center; animation:tw 2.6s ease-in-out infinite; }
    @keyframes in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @keyframes pop { from{opacity:0;transform:translateY(18px) scale(.6)} to{opacity:1;transform:none} }
    @keyframes bounce { 0%,30%,100%{transform:translateY(0) scale(1,1)} 10%{transform:translateY(-12px) scale(.96,1.05)} 20%{transform:translateY(0) scale(1.05,.95)} }
    @keyframes tw { 0%,100%{opacity:.15;transform:scale(.5) rotate(0)} 50%{opacity:1;transform:scale(1) rotate(45deg)} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
