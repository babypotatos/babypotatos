<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="대시보드가 켜진 노트북과 돋보기 그림과 함께, Hello, I'm a Data Analyst. 데이터를 수집하고, 정제하고, 분석합니다." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
    :root { --ink:#1f2328; --muted:#656d76; --acc:#2f6fde; --card:#f6f8fa; --line:#d0d7de; --shadow:rgba(31,35,40,.08); }
    @media (prefers-color-scheme: dark) { :root { --ink:#f0f3f6; --muted:#9198a1; --acc:#5b9bf8; --card:#151b23; --line:#30363d; --shadow:rgba(0,0,0,.35); } }
    text { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif; }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .role { fill:var(--acc); font-size:18px; font-weight:700; animation:in .5s ease both; }
    .name { fill:var(--ink); font-size:60px; font-weight:800; letter-spacing:-1px; animation:in .5s ease .05s both; }
    .desc { fill:var(--muted); font-size:20px; font-weight:500; animation:in .5s ease .1s both; }
    .desc b, .b { fill:var(--ink); font-weight:700; }
    .sub  { fill:var(--muted); font-size:16px; animation:in .5s ease .15s both; }
    @keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    .ln { stroke-dasharray:160; stroke-dashoffset:160; animation:draw 4s ease-in-out infinite; }
    .lnd { opacity:0; animation:dot 4s ease-in-out infinite; }
    .bar { transform-box:fill-box; transform-origin:bottom; animation:grow 1.6s ease-in-out infinite alternate; }
    .donut { transform-box:fill-box; transform-origin:center; animation:spin 8s linear infinite; }
    .float { animation:float 3s ease-in-out infinite alternate; }
    .float2 { animation:float 2.6s ease-in-out .5s infinite alternate; }
    .spark { transform-box:fill-box; transform-origin:center; animation:tw 2.2s ease-in-out infinite; }
    @keyframes draw { 0%{stroke-dashoffset:160} 45%,85%{stroke-dashoffset:0} 100%{stroke-dashoffset:0;opacity:0} }
    @keyframes dot { 0%,40%{opacity:0} 48%,85%{opacity:1} 100%{opacity:0} }
    @keyframes grow { from{transform:scaleY(.55)} to{transform:scaleY(1)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes float { from{transform:translateY(0)} to{transform:translateY(-6px)} }
    @keyframes tw { 0%,100%{transform:scale(.5);opacity:.3} 50%{transform:scale(1);opacity:1} }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; }  }
  </style>

  <rect class="card" x="2" y="2" width="896" height="256" rx="16"/>

  <text class="role" x="58" y="68">Hello, I'm a</text>
  <text class="name" x="54" y="134">Data Analyst</text>
  <text class="desc" x="58" y="182">데이터를 <tspan class="b">수집</tspan>하고, <tspan class="b">정제</tspan>하고, <tspan class="b">분석</tspan>합니다.</text>
  <text class="sub" x="58" y="214">숫자 뒤에 숨은 이야기를 찾고 있어요.</text>

  <!-- illustration: analyst laptop with dashboard -->
  <ellipse cx="720" cy="232" rx="150" ry="7" fill="var(--shadow)"/>
  <!-- laptop -->
  <rect x="604" y="56" width="236" height="152" rx="10" fill="#2d333b" stroke="#57606a" stroke-width="1.5"/>
  <rect x="614" y="66" width="216" height="132" rx="4" fill="#f4f7fc"/>
  <path d="M584 208 H860 L848 224 H596z" fill="#c3ccd6"/>
  <rect x="700" y="208" width="44" height="5" rx="2.5" fill="#aab4c0"/>
  <!-- dashboard -->
  <rect x="614" y="66" width="216" height="16" fill="#e3eaf5"/>
  <circle cx="624" cy="74" r="3" fill="#ff8fab"/><circle cx="634" cy="74" r="3" fill="#ffc857"/><circle cx="644" cy="74" r="3" fill="#22b8a6"/>
  <rect x="626" y="92" width="58" height="22" rx="4" fill="#ffffff"/><rect x="632" y="98" width="22" height="4" rx="2" fill="#c3ccd6"/><rect x="632" y="105" width="34" height="5" rx="2.5" fill="#2f6fde"/>
  <rect x="692" y="92" width="58" height="22" rx="4" fill="#ffffff"/><rect x="698" y="98" width="22" height="4" rx="2" fill="#c3ccd6"/><rect x="698" y="105" width="28" height="5" rx="2.5" fill="#22b8a6"/>
  <rect x="758" y="92" width="60" height="22" rx="4" fill="#ffffff"/><rect x="764" y="98" width="22" height="4" rx="2" fill="#c3ccd6"/><rect x="764" y="105" width="38" height="5" rx="2.5" fill="#ff8fab"/>
  <rect x="626" y="122" width="124" height="66" rx="4" fill="#ffffff"/>
  <path class="ln" d="M634 176 L654 166 L670 170 L688 152 L706 158 L724 138 L742 132" stroke="#2f6fde" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="lnd" cx="742" cy="132" r="4" fill="#2f6fde"/>
  <rect x="758" y="122" width="60" height="66" rx="4" fill="#ffffff"/>
  <rect class="bar" x="766" y="150" width="9" height="30" rx="2" fill="#22b8a6"/>
  <rect class="bar" style="animation-delay:.2s" x="780" y="140" width="9" height="40" rx="2" fill="#22b8a6"/>
  <rect class="bar" style="animation-delay:.4s" x="794" y="158" width="9" height="22" rx="2" fill="#22b8a6"/>
  <rect class="bar" style="animation-delay:.6s" x="808" y="134" width="6" height="46" rx="2" fill="#ffc857"/>
  <!-- floating donut card -->
  <g class="float">
    <rect x="556" y="40" width="74" height="74" rx="12" fill="#ffffff" stroke="#e3e8ef" stroke-width="1.5"/>
    <g class="donut">
      <circle cx="593" cy="77" r="20" fill="none" stroke="#e3eaf5" stroke-width="9"/>
      <circle cx="593" cy="77" r="20" fill="none" stroke="#2f6fde" stroke-width="9" stroke-dasharray="62 126" transform="rotate(-90 593 77)"/>
      <circle cx="593" cy="77" r="20" fill="none" stroke="#ff8fab" stroke-width="9" stroke-dasharray="30 126" stroke-dashoffset="-62" transform="rotate(-90 593 77)"/>
      <circle cx="593" cy="77" r="20" fill="none" stroke="#ffc857" stroke-width="9" stroke-dasharray="20 126" stroke-dashoffset="-92" transform="rotate(-90 593 77)"/>
    </g>
  </g>
  <!-- magnifier -->
  <g class="float2">
    <circle cx="838" cy="168" r="22" fill="#ffffff" fill-opacity=".55" stroke="var(--ink)" stroke-width="6"/>
    <path d="M854 184 L874 204" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
    <path d="M826 160 a14 14 0 0 1 10 -6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <path class="spark" d="M856 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffc857"/>
</svg>
